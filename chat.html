<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#13294B"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="TMU FC App">
<link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest">
<title>メッセージ｜TMU FC App</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF2F7;--surface:#FFFFFF;--ink:#14202E;--sub:#5B6B7E;--line:#D5DDE7;--navy:#13294B;--blue:#1F5FBF;--ok:#23885C;--warn:#B98510;--red:#C93C34;--chip:#E3EAF3;--sel:#DCE8FA;--ga:#1F5FBF;--gb:#23885C;--gr:#B98510;color-scheme:light;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1520;--surface:#162130;--ink:#E5ECF4;--sub:#93A3B6;--line:#273548;--navy:#0B1A30;--blue:#6FA2EE;--ok:#45B985;--warn:#E0B13E;--red:#EE6A61;--chip:#203047;--sel:#1E3354;--ga:#6FA2EE;--gb:#45B985;--gr:#E0B13E;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0D1520;--surface:#162130;--ink:#E5ECF4;--sub:#93A3B6;--line:#273548;--navy:#0B1A30;--blue:#6FA2EE;--ok:#45B985;--warn:#E0B13E;--red:#EE6A61;--chip:#203047;--sel:#1E3354;--ga:#6FA2EE;--gb:#45B985;--gr:#E0B13E;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;font-size:15px;line-height:1.55;padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.num{font-family:"Barlow Condensed","Zen Kaku Gothic New",system-ui,sans-serif;font-weight:700;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header{background:var(--navy);color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 0 12px}
.hrow{display:flex;align-items:center;gap:8px}
.hrow h1{margin:0;font-size:18px;flex:1}
.apptabs{display:inline-flex;max-width:100%;overflow-x:auto;background:rgba(255,255,255,.1);border-radius:999px;padding:3px;margin-top:10px;scrollbar-width:none}
.apptabs a,.apptabs span{color:rgba(255,255,255,.8);font-size:14px;padding:5px 11px;border-radius:999px;text-decoration:none;white-space:nowrap}
.apptabs .on{background:#fff;color:var(--navy);font-weight:700}
main{padding:14px 0 10px}
h2{font-size:16px;margin:22px 0 8px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
h2 small{font-size:12px;font-weight:400;color:var(--sub)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.pad{padding:14px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list .m{flex:1;min-width:0}
.list .m small{display:block;font-size:12px;color:var(--sub)}
.tap{cursor:pointer}.tap:hover{background:var(--sel)}
.go{color:var(--sub);font-size:18px}
.tag{font-size:11px;border-radius:4px;padding:1px 7px;white-space:nowrap;background:var(--chip);color:var(--sub)}
.t-a{background:color-mix(in srgb,var(--ga) 15%,transparent);color:var(--ga)}
.t-b{background:color-mix(in srgb,var(--gb) 15%,transparent);color:var(--gb)}
.t-r{background:color-mix(in srgb,var(--gr) 18%,transparent);color:var(--gr)}
.t-red{background:color-mix(in srgb,var(--red) 15%,transparent);color:var(--red)}
.btn{border:1px solid var(--blue);background:var(--blue);color:#fff;font-weight:700;font-size:15px;padding:11px 18px;border-radius:10px}
.btn.ghost{background:transparent;color:var(--blue)}
.btn.sm{font-size:13px;padding:6px 12px;font-weight:400;border-radius:8px}
.btn.block{width:100%}
.btn.red{background:transparent;color:var(--red);border-color:var(--red)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.note{font-size:12px;color:var(--sub);margin:8px 2px 0}
.empty{padding:18px;text-align:center;color:var(--sub);font-size:13px}
.back{border:0;background:none;color:var(--blue);font-size:15px;padding:4px 0}
.top{display:flex;align-items:center;gap:8px;justify-content:space-between}
.dhead{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:6px 0 4px}
.dhead h2{margin:0;font-size:22px}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--sub)}
.meta b{color:var(--ink)}
.in{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:16px}
textarea.in{min-height:76px;resize:vertical}
.fl{display:block;font-size:12px;color:var(--sub);margin:12px 0 4px}
.fl:first-child{margin-top:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--bg)}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;font-size:14px;color:var(--sub)}
.seg button.on{background:var(--blue);color:#fff;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.stat small{display:block;font-size:11px;color:var(--sub)}
.stat b{font-size:24px;line-height:1.1}
.grp{padding:10px 14px;border-bottom:1px solid var(--line)}
.grp:last-child{border-bottom:0}
.grp h3{margin:0 0 6px;font-size:14px;display:flex;align-items:center;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 11px;font-size:13px;display:inline-flex;align-items:center;gap:4px}
.chip i{font-style:normal;font-size:10px;border-radius:3px;padding:0 4px;background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.menu{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;gap:10px}
.menu:last-child{border-bottom:0}
.menu .no{flex:0 0 26px;height:26px;border-radius:50%;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:14px}
.menu .b{flex:1;min-width:0}
.menu .t{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.menu .t b{font-size:16px}
.menu .d{font-size:13px;color:var(--sub);margin-top:2px}
.menu .x{white-space:pre-line;font-size:14px;margin-top:6px}
.menu .ops{display:flex;flex-direction:column;gap:4px}
.menu .ops button{border:1px solid var(--line);background:none;border-radius:6px;width:30px;height:26px;font-size:12px;color:var(--sub)}
.refl{padding:10px 14px;border-bottom:1px solid var(--line)}
.refl:last-child{border-bottom:0}
.refl .w{font-size:13px;font-weight:700;display:flex;gap:8px;align-items:center}
.refl p{margin:2px 0 0;font-size:14px;white-space:pre-line}
.rv{white-space:pre-line;font-size:14px;margin:0}
.rvh{font-size:12px;color:var(--sub);margin:10px 0 2px}.rvh:first-child{margin-top:0}
.vid a{color:var(--blue);word-break:break-all}
.modal{position:fixed;inset:0;z-index:50;background:rgba(5,12,24,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:90vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.shead{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700;font-size:17px;margin-bottom:10px}
.sfoot{display:flex;gap:8px;justify-content:space-between;margin-top:16px;flex-wrap:wrap}
.lib li{cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#14202E;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:80;max-width:86vw;text-align:center}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:60vh;overflow:auto}
.pgrid button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;text-align:left;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.pgrid button span.g{font-size:11px;border-radius:4px;padding:1px 6px}
@media (min-width:700px){.pgrid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:430px){.apptabs a,.apptabs span{font-size:12px;padding:5px 6px}}
</style><style>
.rm{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 13px;margin-top:8px;color:var(--ink)}
.av{width:38px;height:38px;border-radius:50%;background:var(--chip);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex:none;color:var(--ink)}
.av.gp{background:#E8833A;color:#fff}
.nbtns{display:flex;gap:8px;margin-top:8px}.nbtns .btn{flex:1}
.pk input{width:20px;height:20px;flex:none}
.who2{font-size:11px;color:var(--sub);margin:4px 8px 1px}
.mrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.mrow .n{flex:1;font-size:15px}.mrow small{color:var(--sub);font-size:12px;margin-left:6px}
.av.st{background:var(--navy,#13294B);color:#fff}
.rm .b{flex:1;min-width:0;display:block;overflow:hidden}
.rm .r{flex:none}
.rm .n{font-weight:700;font-size:15px;display:flex;gap:6px;align-items:baseline}
.rm .n small{font-weight:400;font-size:12px;color:var(--sub)}
.rm .l{display:block;font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.rm .r{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:11px;color:var(--sub)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--red)}
.rm.unread .l{color:var(--ink);font-weight:700}
.newbtn{width:100%;margin-top:8px}
.pk{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:9px 2px;color:var(--ink)}
.pk .n{font-weight:700;font-size:15px}.pk small{color:var(--sub);font-size:12px;margin-left:6px}
.pkh{font-size:12px;font-weight:700;color:var(--sub);margin:12px 0 2px}
.pklist{max-height:55vh;overflow-y:auto}
.chhd{display:flex;align-items:center;gap:10px;margin:4px 0 6px}
.chhd .nm{flex:1;font-weight:700;font-size:17px}
.priv{font-size:12px;color:var(--sub);text-align:center;margin:6px 0 10px}
.msgs{display:flex;flex-direction:column;gap:6px;padding-bottom:110px}
.dsep{align-self:center;font-size:11px;color:var(--sub);background:var(--chip);border-radius:999px;padding:2px 10px;margin:8px 0 2px}
.bub{max-width:78%;display:flex;flex-direction:column}
.bub .t{white-space:pre-line;overflow-wrap:anywhere;font-size:15px;line-height:1.5;padding:8px 12px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.bub .tm{font-size:10px;color:var(--sub);margin:2px 6px 0}
.bub.me{align-self:flex-end;align-items:flex-end}
.bub.me .t{background:var(--blue);color:#fff;border-color:var(--blue)}
.bub.me .t{cursor:pointer}
.composer{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px))}
.composer .in2{display:flex;gap:8px;max-width:720px;margin:0 auto;align-items:flex-end}
.composer textarea{flex:1;resize:none;min-height:40px;max-height:120px;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--bg);color:var(--ink)}
.composer button{flex:none}
.blk{background:color-mix(in srgb,var(--red) 12%,transparent);color:var(--red);border-radius:10px;padding:8px 12px;font-size:13px;text-align:center;margin-bottom:8px}
</style></head><body data-page="ch">
<header><div class="wrap"><div class="hrow"><h1>TMU FC App</h1></div>
<nav class="apptabs" aria-label="アプリの切り替え"><a href="home.html">ホーム</a><a href="schedule.html">スケジュール</a><a href="./#pos">ポジション</a><a href="./#game">メンバー選考</a><a href="training.html">トレーニング</a><a href="condition.html">コンディション</a><a href="review.html">振り返り</a><span class="on" aria-current="page">メッセージ</span></nav></div></header>
<main class="wrap" id="main"><p class="empty">読み込んでいます…</p></main>
<script>
window.__CH_MAIN=(function(CTX){
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const W='日月火水木金土';
const dkey=t=>{const d=new Date(t);return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;};
const dlab=t=>{const d=new Date(t),n=new Date();if(dkey(t)===dkey(n))return '今日';const y=new Date(n);y.setDate(n.getDate()-1);if(dkey(t)===dkey(y))return '昨日';return `${d.getMonth()+1}/${d.getDate()}（${W[d.getDay()]}）`;};
const hm=t=>{const d=new Date(t);return `${d.getHours()}:${pad(d.getMinutes())}`;};
const when=t=>dkey(t)===dkey(Date.now())?hm(t):dlab(t);
const ROLE={admin:'監督',staff:'スタッフ',medical:'トレーナー',leader:'幹部',player:'選手'};
const PAGE=50;
let rid=null,list=[],more=false,lim=PAGE;
function toast(t){const o=document.createElement('div');o.className='toast';o.textContent=t;document.body.appendChild(o);setTimeout(()=>o.remove(),2200);}
function ask(msg){return new Promise(res=>{const d=document.createElement('div');d.className='modal';d.innerHTML=`<div class="sheet"><p style="white-space:pre-line;margin:4px 0 0"></p><div class="sfoot" style="justify-content:flex-end"><button class="btn ghost" data-no>やめる</button><button class="btn" data-yes>はい</button></div></div>`;d.querySelector('p').textContent=msg;document.body.appendChild(d);d.querySelector('[data-no]').onclick=()=>{d.remove();res(false);};d.querySelector('[data-yes]').onclick=()=>{d.remove();res(true);};});}
function sheet(html){closeSheet();const d=document.createElement('div');d.className='modal';d.id='sheet';d.innerHTML=`<div class="sheet">${html}</div>`;d.onclick=e=>{if(e.target===d)closeSheet();};document.body.appendChild(d);return d;}
function closeSheet(){const d=$('#sheet');if(d)d.remove();}
const other=r=>r.members.find(u=>u!==CTX.me.uid);
const person=uid=>CTX.dir.find(x=>x.uid===uid);
const nameOf=(r,uid)=>{const p=person(uid);return p?p.name:((r&&r.names&&r.names[uid])||'（退部したメンバー）');};
const subOf=p=>p?(p.role==='player'||p.role==='leader'?`${p.grade?p.grade+'年':''}${p.role==='leader'?'・幹部':''}`:(p.title||ROLE[p.role]||'')):'';
const ini=n=>String(n||'？').trim().charAt(0);
const isStaff=p=>p&&!['player','leader'].includes(p.role);
const isG=r=>r&&r.type==='group';
const roomName=r=>isG(r)?(r.title||'グループ'):nameOf(r,other(r));
const avHtml=r=>{if(isG(r))return `<span class="av gp">${esc(ini(r.title))}</span>`;const o=other(r);const p=person(o);return `<span class="av${isStaff(p)?' st':''}">${esc(ini(nameOf(r,o)))}</span>`;};
const unread=r=>!!r.lastAt&&r.lastBy!==CTX.me.uid&&((r.read||{})[CTX.me.uid]||0)<r.lastAt;

// ---------- 一覧 ----------
function listView(){
  const L=Object.values(CTX.rooms).filter(r=>r.lastAt).sort((a,b)=>b.lastAt-a.lastAt);
  $('#main').innerHTML=`<h2 style="margin-top:6px">メッセージ</h2>
<div class="nbtns"><button class="btn" id="nw">＋ 1対1</button><button class="btn" id="ng">＋ グループ</button></div>
${L.length?L.map(r=>{const g=isG(r);const o=g?null:other(r);const p=g?null:person(o);const u=unread(r);const by=r.lastBy===CTX.me.uid?'あなた：':(g?esc(nameOf(r,r.lastBy))+'：':'');return `<button class="rm${u?' unread':''}" data-r="${esc(r.id)}">${avHtml(r)}<span class="b"><span class="n">${esc(roomName(r))}<small>${g?(r.members||[]).length+'人':esc(subOf(p))}</small></span><span class="l">${by}${esc(r.lastText||'')}</span></span><span class="r">${esc(when(r.lastAt))}${u?'<span class="dot" aria-label="未読"></span>':''}</span></button>`;}).join(''):'<div class="card empty" style="margin-top:12px">まだメッセージはありません。<br>「＋ 1対1」か「＋ グループ」から始めます。</div>'}
<p class="note">メッセージは、1対1なら2人だけ、グループならそのメンバーだけが見られます（監督・スタッフも、入っていなければ見られません）。相手を大切に、RE.Challengeの「Respect」を忘れずに。</p>`;
  $('#nw').onclick=pick;$('#ng').onclick=()=>pickMany(null);
  document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{location.hash=b.dataset.r;});
}
function pick(){
  const grp=[['スタッフ',CTX.dir.filter(p=>isStaff(p))],...[4,3,2,1].map(g=>[g+'年',CTX.dir.filter(p=>!isStaff(p)&&p.grade===g)]),['その他',CTX.dir.filter(p=>!isStaff(p)&&![1,2,3,4].includes(p.grade))]].filter(x=>x[1].length);
  const d=sheet(`<div class="shead">相手を選ぶ<button class="btn ghost sm" data-x>閉じる</button></div>
<input class="in" id="pq" placeholder="名前で探す">
<div class="pklist">${grp.map(([h,a])=>`<div class="pkh">${h}</div>${a.sort((x,y)=>x.name.localeCompare(y.name,'ja')).map(p=>`<button class="pk" data-u="${esc(p.uid)}" data-nm="${esc(p.name)}"><span class="av${isStaff(p)?' st':''}">${esc(ini(p.name))}</span><span><span class="n">${esc(p.name)}</span><small>${esc(subOf(p))}</small></span></button>`).join('')}`).join('')||'<p class="note">まだ相手がいません。部員がアプリに登録すると表示されます。</p>'}</div>`);
  d.querySelector('[data-x]').onclick=closeSheet;
  d.querySelector('#pq').oninput=e=>{const q=e.target.value.trim();d.querySelectorAll('.pk').forEach(b=>b.style.display=!q||b.dataset.nm.includes(q)?'':'none');};
  d.querySelectorAll('[data-u]').forEach(b=>b.onclick=async()=>{const p=person(b.dataset.u);if(!p)return;try{const r=await CTX.ensure(p);closeSheet();location.hash=r;}catch(e){console.error(e);toast('開けませんでした');}});
}

function grpList(excl,multi){const ex=new Set(excl||[]);const pool=CTX.dir.filter(p=>!ex.has(p.uid));
  const grp=[['スタッフ',pool.filter(p=>isStaff(p))],...[4,3,2,1].map(g=>[g+'年',pool.filter(p=>!isStaff(p)&&p.grade===g)]),['その他',pool.filter(p=>!isStaff(p)&&![1,2,3,4].includes(p.grade))]].filter(x=>x[1].length);
  return grp.map(([h,a])=>`<div class="pkh">${h}</div>${a.sort((x,y)=>x.name.localeCompare(y.name,'ja')).map(p=>`<label class="pk" data-nm="${esc(p.name)}"><input type="checkbox" value="${esc(p.uid)}"><span class="av${isStaff(p)?' st':''}">${esc(ini(p.name))}</span><span><span class="n">${esc(p.name)}</span><small>${esc(subOf(p))}</small></span></label>`).join('')}`).join('')||'<p class="note">追加できる人がいません。</p>';}
// グループを作る（room=null）／メンバーを追加する（room あり）
function pickMany(room){
  const d=sheet(`<div class="shead">${room?'メンバーを追加':'グループを作る'}<button class="btn ghost sm" data-x>閉じる</button></div>
${room?'':'<label class="fl" style="margin-top:0">グループの名前</label><input class="in" id="gt" maxlength="30" placeholder="例：GK陣、4年、セットプレー担当">'}
<label class="fl">メンバーを選ぶ <span id="gc" style="font-weight:400"></span></label><input class="in" id="pq" placeholder="名前で探す">
<div class="pklist">${grpList(room?room.members:[CTX.me.uid])}</div>
<div class="sfoot" style="justify-content:flex-end"><button class="btn" id="gok">${room?'追加する':'作る'}</button></div>`);
  d.querySelector('[data-x]').onclick=closeSheet;
  const cnt=()=>{const n=d.querySelectorAll('.pk input:checked').length;d.querySelector('#gc').textContent=n?`（${n}人を選択中）`:'';};
  d.querySelectorAll('.pk input').forEach(c=>c.onchange=cnt);
  d.querySelector('#pq').oninput=e=>{const q=e.target.value.trim();d.querySelectorAll('.pk').forEach(b=>b.style.display=!q||b.dataset.nm.includes(q)?'':'none');};
  d.querySelector('#gok').onclick=async()=>{const ps=[...d.querySelectorAll('.pk input:checked')].map(c=>person(c.value)).filter(Boolean);
    if(!room){const t=d.querySelector('#gt').value.trim();if(!t)return toast('グループの名前を入れてください');if(!ps.length)return toast('メンバーを1人以上選んでください');if(ps.length>59)return toast('グループは60人までです');
      try{const r=await CTX.createGroup(t,ps);closeSheet();location.hash=r;}catch(e){console.error(e);toast('作れませんでした');}return;}
    if(!ps.length)return toast('追加する人を選んでください');if((room.members||[]).length+ps.length>60)return toast('グループは60人までです');
    try{await CTX.addMembers(room.id,ps);closeSheet();toast('追加しました');}catch(e){console.error(e);toast('追加できませんでした');}};
}
function groupMenu(r){const own=r.owner===CTX.me.uid;
  const d=sheet(`<div class="shead">${esc(r.title||'グループ')}<button class="btn ghost sm" data-x>閉じる</button></div>
${own?`<label class="fl" style="margin-top:0">グループの名前</label><div class="row2" style="grid-template-columns:1fr auto"><input class="in" id="rn" maxlength="30" value="${esc(r.title||'')}"><button class="btn ghost" id="rnok">変更</button></div>`:''}
<label class="fl">メンバー（${(r.members||[]).length}人）</label>
<div>${(r.members||[]).map(u=>{const p=person(u);return `<div class="mrow"><span class="av${isStaff(p)?' st':''}">${esc(ini(nameOf(r,u)))}</span><span class="n">${esc(nameOf(r,u))}${u===CTX.me.uid?'（あなた）':''}<small>${u===r.owner?'作成者':esc(subOf(p))}</small></span>${own&&u!==CTX.me.uid?`<button class="btn ghost sm" data-rm="${esc(u)}">外す</button>`:''}</div>`;}).join('')}</div>
<div class="sfoot" style="justify-content:space-between"><button class="btn ghost" id="lv" style="color:var(--red);border-color:var(--red)">グループを抜ける</button><button class="btn" id="ad">＋ メンバーを追加</button></div>`);
  d.querySelector('[data-x]').onclick=closeSheet;
  d.querySelector('#ad').onclick=()=>pickMany(r);
  const rn=d.querySelector('#rnok');if(rn)rn.onclick=async()=>{const t=d.querySelector('#rn').value.trim();if(!t)return toast('名前を入れてください');try{await CTX.rename(r.id,t);closeSheet();toast('変更しました');}catch(e){toast('変更できませんでした');}};
  d.querySelectorAll('[data-rm]').forEach(b=>b.onclick=async()=>{if(!await ask(`${nameOf(r,b.dataset.rm)}さんをグループから外しますか？`))return;try{await CTX.removeMember(r.id,b.dataset.rm);closeSheet();toast('外しました');}catch(e){toast('外せませんでした');}});
  d.querySelector('#lv').onclick=async()=>{if(!await ask('このグループを抜けますか？\n抜けると、このグループのメッセージは見られなくなります。'))return;try{await CTX.leave(r.id);closeSheet();toast('抜けました');location.hash='';}catch(e){console.error(e);toast('抜けられませんでした');}};
}

// ---------- ルーム ----------
function openRoom(id){rid=id;lim=PAGE;list=[];more=false;roomView(true);CTX.open(id,lim,onMsgs);}
function onMsgs(m,mo){if(m===null){toast('読み込めませんでした');return;}const atEnd=window.innerHeight+window.scrollY>=document.body.scrollHeight-80;const grew=m.length>list.length;list=m;more=mo;drawMsgs();
  if(grew&&atEnd||!roomView.drawn){window.scrollTo(0,document.body.scrollHeight);roomView.drawn=true;}
  const r=CTX.rooms[rid];if(r&&unread(r))CTX.read(rid);}
function roomView(first){
  const r=CTX.rooms[rid];const g=isG(r);const o=g?null:(r?other(r):rid.split('_').find(u=>u!==CTX.me.uid));const p=g?null:person(o);
  const blocked=r&&(r.block||[]).length;const iBlock=r&&(r.block||[]).includes(CTX.me.uid);
  if(first)roomView.drawn=false;
  $('#main').innerHTML=`<div class="chhd"><button class="back" id="bk" style="margin:0">‹</button>${g?avHtml(r):`<span class="av${isStaff(p)?' st':''}">${esc(ini(nameOf(r,o)))}</span>`}<span class="nm">${esc(g?roomName(r):nameOf(r,o))}<small style="font-weight:400;font-size:12px;color:var(--sub);margin-left:6px">${g?(r.members||[]).length+'人':esc(subOf(p))}</small></span><button class="btn ghost sm" id="mn">${g?'メンバー':'…'}</button></div>
<p class="priv">${g?'このグループのメンバーだけが見られます':'このやりとりは、2人だけが見られます'}</p>
${blocked?`<div class="blk">${iBlock?'あなたがブロックしています。メッセージは送れません。':'メッセージを送れない状態です。'}</div>`:''}
<div class="msgs" id="msgs"></div>`;
  let c=$('.composer');if(!c){c=document.createElement('div');c.className='composer';c.innerHTML='<div class="in2"><textarea id="tx" rows="1" maxlength="1000" placeholder="メッセージを入力"></textarea><button class="btn" id="sd">送信</button></div>';document.body.appendChild(c);}
  $('#tx').disabled=!!blocked;$('#sd').disabled=!!blocked;
  $('#tx').oninput=e=>{e.target.style.height='auto';e.target.style.height=Math.min(120,e.target.scrollHeight)+'px';};
  $('#sd').onclick=async()=>{const t=$('#tx').value.trim();if(!t)return;$('#sd').disabled=true;try{await CTX.send(rid,t);$('#tx').value='';$('#tx').style.height='auto';window.scrollTo(0,document.body.scrollHeight);}catch(e){console.error(e);toast('送れませんでした');}$('#sd').disabled=false;$('#tx').focus();};
  $('#bk').onclick=()=>{location.hash='';};
  $('#mn').onclick=async()=>{const rr=CTX.rooms[rid];if(isG(rr)){groupMenu(rr);return;}if(!rr){toast('メッセージを送ると設定できます');return;}const on=(rr.block||[]).includes(CTX.me.uid);
    if(!await ask(on?'ブロックを解除しますか？\nまたメッセージを送り合えるようになります。':`${nameOf(rr,o)}さんをブロックしますか？\nこのルームでは、お互いにメッセージを送れなくなります。困っていることがあれば、監督やスタッフに相談してください。`))return;
    try{await CTX.block(rid,!on);toast(on?'解除しました':'ブロックしました');}catch(e){toast('できませんでした');}};
  drawMsgs();
}
function drawMsgs(){const box=$('#msgs');if(!box)return;let prev='',pby='';const r=CTX.rooms[rid];const g=isG(r);
  box.innerHTML=`${more?'<button class="btn ghost sm" id="mo" style="align-self:center">前のメッセージを見る</button>':''}${list.length?list.map(m=>{const k=dkey(m.at);const sep=k!==prev?`<div class="dsep">${esc(dlab(m.at))}</div>`:'';const showWho=g&&m.by!==CTX.me.uid&&(m.by!==pby||sep);prev=k;pby=m.by;const mine=m.by===CTX.me.uid;
    return `${sep}<div class="bub${mine?' me':''}">${showWho?`<div class="who2">${esc(nameOf(r,m.by))}</div>`:''}<div class="t"${mine?` data-m="${esc(m.id)}"`:''}>${esc(m.text)}</div><div class="tm">${hm(m.at)}</div></div>`;}).join(''):'<p class="note" style="text-align:center">最初のメッセージを送ってみましょう</p>'}`;
  const mo=$('#mo');if(mo)mo.onclick=()=>{lim+=PAGE;const h=document.body.scrollHeight;CTX.open(rid,lim,(m,x)=>{list=m||list;more=x;drawMsgs();window.scrollTo(0,document.body.scrollHeight-h);});};
  box.querySelectorAll('[data-m]').forEach(b=>b.onclick=async()=>{if(!await ask('このメッセージを取り消しますか？\n相手の画面からも消えます。'))return;try{await CTX.del(rid,b.dataset.m);}catch(e){toast('取り消せませんでした');}});
}

function route(){const id=decodeURIComponent(location.hash.slice(1));const c=$('.composer');
  document.body.classList.toggle('in-room',!!(id&&(CTX.rooms[id]||id.split('_').includes(CTX.me.uid))));
  if(id&&(CTX.rooms[id]||id.split('_').includes(CTX.me.uid))){openRoom(id);}else{rid=null;CTX.close();if(c)c.remove();listView();}}
window.addEventListener('hashchange',()=>{closeSheet();route();});
CTX.onRooms(()=>{if(rid&&rid.charAt(0)==='g'&&!CTX.rooms[rid]){closeSheet();toast('このグループから外れました');location.hash='';return;}
  if(rid&&isG(CTX.rooms[rid])&&!$('#sheet')&&!$('.modal')){const y=window.scrollY;roomView(false);window.scrollTo(0,y);return;}
  if($('#sheet')||$('.modal'))return;if(rid){const r=CTX.rooms[rid];const b=$('.blk');const want=!!(r&&(r.block||[]).length);if(!!b!==want){const y=window.scrollY;roomView(false);window.scrollTo(0,y);}}else listView();});
route();
});
</script>
<script type="module" src="fb.js"></script>
