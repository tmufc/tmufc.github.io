<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#13294B"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="TMU FC App">
<link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" href="icon-192.png">
<title>コンディション｜TMU FC App</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF2F7;--surface:#FFFFFF;--ink:#14202E;--sub:#5B6B7E;--line:#D5DDE7;--navy:#13294B;--blue:#1F5FBF;--ok:#23885C;--warn:#B98510;--red:#C93C34;--chip:#E3EAF3;--sel:#DCE8FA;color-scheme:light;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1520;--surface:#162130;--ink:#E5ECF4;--sub:#93A3B6;--line:#273548;--navy:#0B1A30;--blue:#6FA2EE;--ok:#45B985;--warn:#E0B13E;--red:#EE6A61;--chip:#203047;--sel:#1E3354;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0D1520;--surface:#162130;--ink:#E5ECF4;--sub:#93A3B6;--line:#273548;--navy:#0B1A30;--blue:#6FA2EE;--ok:#45B985;--warn:#E0B13E;--red:#EE6A61;--chip:#203047;--sel:#1E3354;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;font-size:15px;line-height:1.55;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.num{font-family:"Barlow Condensed","Zen Kaku Gothic New",system-ui,sans-serif;font-weight:700;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header{background:var(--navy);color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 0 0}
.hrow{display:flex;align-items:center;gap:8px}
.hrow h1{margin:0;font-size:18px;flex:1}
.trial{font-size:11px;background:rgba(255,255,255,.15);border-radius:4px;padding:1px 7px}
.hlink{color:rgba(255,255,255,.8);font-size:12px;text-decoration:none;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:3px 10px}
.apptabs{display:inline-flex;max-width:100%;overflow-x:auto;scrollbar-width:none;background:rgba(255,255,255,.1);border-radius:999px;padding:3px;margin-top:10px}
.apptabs a,.apptabs span{color:rgba(255,255,255,.8);font-size:14px;padding:5px 11px;border-radius:999px;text-decoration:none;white-space:nowrap}
.apptabs .on{background:#fff;color:var(--navy);font-weight:700}
.role{display:flex;gap:2px;margin-top:10px}
.role button{border:0;background:transparent;color:rgba(255,255,255,.7);font-size:14px;padding:8px 14px 10px;border-bottom:3px solid transparent}
.role button.on{color:#fff;border-bottom-color:#fff;font-weight:700}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:rgba(255,255,255,.75);padding:4px 0 10px}
.who b{color:#fff;font-size:15px}
.who button{border:0;background:none;color:#9CC0FF;font-size:12px;padding:0}
main{padding:14px 0 10px}
h2{font-size:16px;margin:20px 0 8px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
h2 small{font-size:12px;font-weight:400;color:var(--sub)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.pad{padding:14px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list .m{flex:1;min-width:0}
.list .m small{display:block;font-size:12px;color:var(--sub)}
.tap{cursor:pointer}.tap:hover{background:var(--sel)}
.go{color:var(--sub);font-size:18px}
.tag{font-size:11px;border-radius:4px;padding:1px 7px;white-space:nowrap;background:var(--chip);color:var(--sub)}
.t-red{background:color-mix(in srgb,var(--red) 15%,transparent);color:var(--red)}
.t-warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.t-blue{background:color-mix(in srgb,var(--blue) 15%,transparent);color:var(--blue)}
.t-ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.btn{border:1px solid var(--blue);background:var(--blue);color:#fff;font-weight:700;font-size:15px;padding:11px 18px;border-radius:10px}
.btn.ghost{background:transparent;color:var(--blue)}
.btn.sm{font-size:13px;padding:6px 12px;font-weight:400;border-radius:8px}
.btn.block{width:100%}
.btn.red{background:transparent;color:var(--red);border-color:var(--red)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.note{font-size:12px;color:var(--sub);margin:8px 2px 0}
.err{font-size:13px;color:var(--red);margin:8px 0 0}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.nav .wrap{display:grid;padding:0}
.nav button{border:0;background:none;padding:8px 0 9px;font-size:11px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:56px}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--blue)}
.nav .badge{position:relative}
.nav .badge i{position:absolute;top:-4px;right:-10px;background:var(--red);color:#fff;font-style:normal;font-size:10px;border-radius:999px;min-width:16px;height:16px;line-height:16px;padding:0 4px}
/* player home */
.hello{background:var(--navy);color:#fff;border-radius:14px;padding:16px;position:relative;overflow:hidden}
.hello .d{font-size:13px;color:rgba(255,255,255,.75)}
.hello .n{font-size:24px;font-weight:700;margin:2px 0 0}
.hello svg{position:absolute;right:-10px;bottom:-14px;opacity:.16}
.todo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.todo button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 12px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:96px}
.todo button b{font-size:15px}
.todo button small{font-size:12px;color:var(--sub)}
.todo button.done{border-color:var(--ok)}
.todo button.done .st{color:var(--ok)}
.todo button .st{font-size:12px;font-weight:700;color:var(--blue)}
.todo button.wide{grid-column:1/-1;min-height:0}
.todo button.alert{border-color:var(--red)}
.todo button.alert .st{color:var(--red)}
.injbox{border-left:4px solid var(--red);border-radius:0;padding:12px 14px;background:var(--surface);margin-top:12px}
/* forms */
.fhead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.fhead h2{margin:0;flex:1}
.back{border:0;background:none;color:var(--blue);font-size:14px;padding:4px 0}
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.q .ql{font-weight:700;font-size:15px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline}
.q .ql small{font-weight:400;font-size:12px;color:var(--sub)}
.scale{display:grid;gap:6px}
.scale button{border:1px solid var(--line);background:var(--bg);border-radius:10px;height:48px;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:22px}
.scale button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.scale.rpe button{height:44px;font-size:19px}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-top:6px}
.rpedesc{font-size:13px;text-align:center;margin-top:8px;min-height:20px;color:var(--blue);font-weight:700}
.stepper{display:flex;align-items:center;justify-content:center;gap:18px}
.stepper button{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:26px;line-height:1}
.stepper .v{font-size:44px;min-width:110px;text-align:center}
.stepper .v small{font-size:18px;color:var(--sub)}
.choice{display:flex;flex-wrap:wrap;gap:8px}
.choice button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:9px 16px;font-size:15px}
.choice button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.parts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.parts button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 4px;font-size:13px;min-height:46px}
.parts button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.in{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:16px}
textarea.in{min-height:72px;resize:vertical}
.submit{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%);padding:16px 0 4px}
/* staff */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:left}
.kpi p{margin:0;font-size:11px;color:var(--sub);line-height:1.3}
.kpi b{font-size:28px;line-height:1.1;display:block}
.kpi b small{font-size:14px;color:var(--sub)}
.kpi.r b{color:var(--red)}
.al{flex:0 0 10px;width:10px;height:10px;border-radius:50%}
.al-red{background:var(--red)}.al-warn{background:var(--warn)}.al-info{background:var(--blue)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 6px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:400;color:var(--sub);font-size:12px}
td:first-child,th:first-child{text-align:left;padding-left:14px}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--sel)}
.dot{display:inline-block;min-width:30px;padding:1px 6px;border-radius:5px;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:16px}
.d-g{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.d-m{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.d-b{background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.chips button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;font-size:13px;padding:5px 13px}
.chips button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chart{padding:12px}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--sub);margin-top:6px}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:4px;vertical-align:3px}
.ph{display:flex;align-items:flex-end;gap:12px;margin-bottom:10px}
.ph h1{margin:0;font-size:22px}
.ph p{margin:0;font-size:13px;color:var(--sub)}
.post{display:flex;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.post.picked{border:2px solid var(--warn);padding:11px}
.av{flex:0 0 40px;height:40px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.pb{flex:1;min-width:0}
.pt{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.pt small{font-size:12px;color:var(--sub)}
.tags{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin-top:4px}
.k-0{background:color-mix(in srgb,var(--blue) 15%,transparent);color:var(--blue)}
.k-1{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.k-2{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.k-3{background:color-mix(in srgb,#8A5CC7 16%,transparent);color:#8A5CC7}
.k-4{background:color-mix(in srgb,var(--red) 15%,transparent);color:var(--red)}
.pmin{font-size:18px;margin-left:4px}.pmin small{font-size:12px;color:var(--sub)}
.pn{margin:6px 0 0;font-size:14px;white-space:pre-wrap;word-break:break-word}
.pa{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.likers{display:flex;align-items:center;gap:5px;border:0;background:none;padding:0;margin-top:8px;font-size:12px;color:var(--sub);text-align:left}
.likers svg{width:14px;height:14px;flex:0 0 auto;color:var(--blue)}
.likers span{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.like{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px;font-size:13px;min-height:34px}
.like svg{width:16px;height:16px}
.like.on{background:var(--blue);border-color:var(--blue);color:#fff}
.pickbtn{border:1px dashed var(--warn);background:none;color:var(--warn);border-radius:999px;padding:5px 12px;font-size:12px;min-height:34px}
.pickbtn.on{border-style:solid;background:color-mix(in srgb,var(--warn) 15%,transparent);font-weight:700}
.pickmark{font-size:12px;color:var(--warn);font-weight:700}
.nudge{margin-top:12px;border-left:4px solid var(--warn);border-radius:0 12px 12px 0}
.nudge small{color:var(--sub)}
.dl{display:grid;grid-template-columns:92px 1fr;align-items:center;gap:8px;font-size:14px}
.dl span{color:var(--sub)}
.evrow{display:grid;grid-template-columns:140px 1fr auto;gap:6px;align-items:center}
@media (max-width:420px){.evrow{grid-template-columns:1fr auto}.evrow input[type=date]{grid-column:1/-1}}
.kv{display:grid;grid-template-columns:100px 1fr;gap:6px 10px;font-size:14px}
.kv span:nth-child(odd){color:var(--sub)}
.stages{display:flex;height:30px;border-radius:8px;overflow:hidden;margin:8px 0 4px}
.stages span{display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff}
.stages span.done{opacity:.4}
.stages span.now{box-shadow:inset 0 0 0 3px rgba(255,255,255,.8);font-weight:700}
.s0{background:var(--red)}.s1{background:var(--warn)}.s2{background:var(--blue)}.s3{background:var(--ok)}
.stlab{display:flex;justify-content:space-between;font-size:11px;color:var(--sub)}
.modal{position:fixed;inset:0;background:rgba(5,12,24,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:85vh;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;overflow:auto}
.sheet.center{border-radius:16px;margin:auto 16px;max-width:420px}
.modal.c{align-items:center}
.shead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:17px;font-weight:700}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:14px;padding:10px 18px;border-radius:10px;z-index:40;max-width:90%;text-align:center}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pick button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px;text-align:left;font-size:15px}
.pick button small{display:block;font-size:11px;color:var(--sub)}
.gh{font-size:12px;color:var(--sub);margin:12px 0 6px}
.empty{padding:18px;text-align:center;color:var(--sub);font-size:13px}
@media (min-width:700px){.todo{grid-template-columns:repeat(4,1fr)}.pick{grid-template-columns:repeat(3,1fr)}}
@media (max-width:430px){.apptabs a,.apptabs span{font-size:12px;padding:5px 6px}}
</style></head><body data-page="cond">

<div class="role" role="tablist" aria-label="表示の切り替え"><button data-role="player" role="tab">自分の入力</button><button data-role="staff" role="tab">チームの管理</button></div><div id="who"></div></div></header>
<main class="wrap" id="main"></main>

<script>
window.__COND_MAIN=(function(CTX){
const ROSTER_SEED=[];
// ---------- storage ----------
const K='tmu-cond-data',KP='tmu-pos-data',KU='tmu-cond-ui';
let mem={};
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return mem[k]??null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}}};
const jget=(k,d)=>{try{return JSON.parse(ls.get(k))??d}catch(e){return d}};
let DB=CTX.db;
const pos=jget(KP,null);
const ROSTER=CTX.roster.map(p=>({id:p.id,name:p.name,grade:p.grade||0,team:p.team||'',p1:p.p1||''})).sort((a,b)=>(b.grade-a.grade)||a.name.localeCompare(b.name,'ja'));
const byId=id=>ROSTER.find(p=>p.id===id)||{id,name:'（名簿にない選手）',grade:0,team:'',p1:'',gone:true};
const SELFK=['筋トレ','ランニング','ボール・技術','ケア','リハビリ','その他'];
let UI=jget(KU,{role:'player',me:'',tab:'home',stab:'today'});
UI.role=CTX.role==='player'?'player':CTX.role==='leader'?(UI.role==='player'?'player':'staff'):'staff';if(CTX.role==='player'||CTX.role==='leader')UI.me=CTX.pid;
function save(){CTX.save();syncPos();}
function saveUI(){ls.set(KU,JSON.stringify(UI));}
// ---------- dates ----------
const pad=n=>String(n).padStart(2,'0');
const ds=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const TODAY=new Date();TODAY.setHours(0,0,0,0);const T=ds(TODAY);
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const pd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const WD='日月火水木金土';
const md=s=>{const d=pd(s);return `${d.getMonth()+1}/${d.getDate()}`;};
const mdw=s=>{const d=pd(s);return `${d.getMonth()+1}/${d.getDate()}（${WD[d.getDay()]}）`;};
const days=n=>[...Array(n)].map((_,i)=>ds(addD(TODAY,i-n+1)));
// ---------- sample data ----------
function makeSample(){
  let seed=17;const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280;};
  const db={entries:{},reports:[],injuries:[],absences:[],sample:true};
  ROSTER.forEach((p,pi)=>{let f=1.6+rnd()*1.2;
    for(let i=-27;i<=0;i++){const d=ds(addD(TODAY,i));const dow=pd(d).getDay();
      f=Math.max(1,Math.min(3.4,f+(rnd()-.5)*1.1));
      const e=(db.entries[d]=db.entries[d]||{});const x=e[p.id]={};
      if(i<0?rnd()<.92:rnd()<.72)x.am={sleep:Math.round((5.5+rnd()*3)*2)/2,sq:Math.max(1,Math.min(5,Math.round(3+rnd()*2-.5))),fat:Math.round(f),sore:Math.max(1,Math.min(4,Math.round(f+(rnd()-.5)*1.4))),mood:Math.max(1,Math.min(5,Math.round(5-f+rnd()*1.2))),pain:false,at:'07:'+pad(Math.floor(rnd()*50))};
      if(i<0&&dow!==1&&rnd()<.9)x.pm={rpe:Math.max(2,Math.min(9,Math.round(4.5+rnd()*3.5+(dow===3?1:0)))),min:[90,100,110,120][Math.floor(rnd()*4)],note:''};
    }});
  const sp=(k,i,v)=>{const p=ROSTER[k];if(!p)return;const d=ds(addD(TODAY,i));db.entries[d][p.id].am=Object.assign({sleep:7,sq:3,fat:2,sore:2,mood:3,pain:false,at:'07:20'},db.entries[d][p.id].am||{},v);};
  sp(0,-1,{fat:4});sp(0,0,{fat:5,sore:4});sp(5,0,{sleep:4.5,sq:2});sp(9,0,{sore:5});
  [3,20].forEach(k=>{const p=ROSTER[k];if(p)for(let i=-7;i<0;i++){const x=db.entries[ds(addD(TODAY,i))][p.id];if(x.pm)x.pm.rpe=Math.min(10,x.pm.rpe+2),x.pm.min=120;}});

function bindForm(){
  document.querySelectorAll('[data-sc]').forEach(b=>b.onclick=()=>{F[b.dataset.sc]=+b.dataset.v;rerender();});

function submitForm(){keepText();const me=byId(UI.me),k=F._k;const err=t=>{$('#f_err').textContent=t;};
  const now=new Date(),hm=`${pad(now.getHours())}:${pad(now.getMinutes())}`;
  if(k==='am'){const miss=[['sq','睡眠の質'],['fat','疲労感'],['sore','筋肉の張り'],['mood','気分']].filter(([x])=>F[x]==null).map(x=>x[1]);if(!F.pain_s)miss.push('痛みや違和感');
    if(miss.length)return err(`${miss.join('・')}を選んでください。`);
    setEnt(T,me.id,'am',{sleep:F.sleep,sq:F.sq,fat:F.fat,sore:F.sore,mood:F.mood,pain:F.pain_s==='ある',at:hm});save();

    toast('朝のチェックを送信しました');return home();}
  if(k==='pm'){if(F.rpe==null)return err('きつさを選んでください。');setEnt(T,me.id,'pm',{rpe:F.rpe,min:+F.min_s||120,note:F.note||''});save();toast('送信しました。おつかれさまでした');return home();}
  if(k==='pain'){const miss=[['part','部位'],['side','左右'],['level','痛みの程度'],['join','練習への参加']].filter(([x])=>!F[x]).map(x=>x[1]);if(miss.length)return err(`${miss.join('・')}を選んでください。`);
    DB.reports.push({id:'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),pid:me.id,date:T,at:hm,part:F.part,side:F.side,level:F.level,join:F.join,when:F.when||'',status:'new'});save();toast('トレーナーに報告しました');return home();}
  if(k==='self'){if(!F.kinds.length)return err('内容を選んでください。');if(F.rpe==null)return err('きつさを選んでください。');if(!F.date)return err('日付を入れてください。');
    DB.self.push({id:'s'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),pid:me.id,date:F.date,ts:Date.now(),kinds:F.kinds.slice(),min:F.min,rpe:F.rpe,note:F.note||'',shared:F.share==='共有する',likes:[]});save();toast(F.share==='共有する'?'記録してチームに共有しました':'自主トレを記録しました');return home();}
  if(k==='abs'){if(!F.kind)return err('欠席・遅刻・早退のどれかを選んでください。');if(!F.reason)return err('理由を選んでください。');if(!F.date)return err('日付を入れてください。');
    DB.absences=DB.absences.filter(a=>!(a.pid===me.id&&a.date===F.date));DB.absences.push({id:'a'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),pid:me.id,date:F.date,kind:F.kind,reason:F.reason,note:F.note||''});save();toast('連絡しました');return home();}}

<div class="card pad"><div class="kv"><span>受傷日</span><span>${mdw(j.date)}</span><span>いまの段階</span><span><b>${STG[j.stage]}</b>（${STGD[j.stage]}）</span>${j.notes[j.stage]?`<span>いまの内容</span><span>${esc(j.notes[j.stage])}</span>`:''}</div></div>
<h2>復帰までの予定<small>トレーナーが入力</small></h2><div class="card pad"><div class="stages">${[0,1,2,3].map(k=>`<span class="s${k} ${k<j.stage?'done':k===j.stage?'now':''}" style="width:${w[k]/sw*100}%">${STG[k]}</span>`).join('')}</div><div class="stlab">${pl.map(d=>`<span>${mdx(d)}</span>`).join('')}</div>
<ul class="list" style="margin-top:8px">${[0,1,2,3].map(k=>`<li style="padding-left:0;padding-right:0;align-items:flex-start"><div class="m">${STG[k]}<small>${esc(j.notes[k])||STGD[k]}</small></div><span class="num" style="font-size:17px">${k===0?md(j.date):mdx(pl[k])}</span>${k===0?'':`<span class="tag ${k<=j.stage?'t-ok':pl[k]&&pl[k]<T?'t-red':pl[k]?'t-blue':''}">${k<=j.stage?'済'+(j.actual[k]&&j.actual[k]!==pl[k]?'（'+md(j.actual[k])+'）':''):pl[k]&&pl[k]<T?'予定超過':pl[k]?'予定':'未定'}</span>`}</li>`).join('')}</ul>
${evs.length?`<div class="gh">通院・再評価など</div><ul class="list">${evs.map(e=>`<li style="padding-left:0;padding-right:0"><div class="m">${esc(e.text)}</div><span class="num" style="font-size:17px">${md(e.date)}</span><span class="tag ${e.date<T?'':'t-blue'}">${e.date<T?'済':'予定'}</span></li>`).join('')}</ul>`:''}
<div class="acts">${j.stage<3?`<button class="btn" id="ij_adv">「${STG[j.stage+1]}」に進める</button>`:''}<button class="btn ghost" id="ij_edit">予定を編集</button>${j.stage>0?'<button class="btn ghost sm" id="ij_back">1つ前の段階に戻す</button>':''}<button class="btn ghost sm" id="ij_del" style="color:var(--red);border-color:var(--red)">このケガを削除</button></div></div>
<h2>受傷前後の体調<small>疲労・張り</small></h2><div class="card chart">${D.length>1?line([{v:ams.map(x=>x?x.fat:null),c:'var(--red)'},{v:ams.map(x=>x?x.sore:null),c:'var(--warn)'}],{labels:D.map((d,i)=>d===j.date?'受傷':i%2===1?md(d):''),band:[4,5]}):'<div class="empty">データがありません</div>'}<div class="legend"><span><i style="background:var(--red)"></i>疲労</span><span><i style="background:var(--warn)"></i>張り</span></div></div>
${selfRec(j.pid,true)}
<p class="note">実際の復帰は、医師やトレーナーの判断で決めてください。</p>`;}
function sInjEdit(id){const j=fixInj(DB.injuries.find(x=>x.id===id)),p=byId(j.pid);
  let evs=j.events.map(e=>({...e}));
  const evHtml=()=>evs.map((e,i)=>`<div class="evrow"><input type="date" class="in" data-evd="${i}" value="${e.date}"><input class="in" data-evt="${i}" value="${esc(e.text)}" placeholder="例：整形外科で再評価"><button class="btn ghost sm" data-evx="${i}" aria-label="この予定を外す">外す</button></div>`).join('');
  window.__bind=()=>{
    const sync=()=>{document.querySelectorAll('[data-evd]').forEach(x=>evs[+x.dataset.evd].date=x.value);document.querySelectorAll('[data-evt]').forEach(x=>evs[+x.dataset.evt].text=x.value);};
    const redraw=()=>{$('#evs').innerHTML=evHtml();bindEv();};
    const bindEv=()=>{document.querySelectorAll('[data-evx]').forEach(b=>b.onclick=()=>{sync();evs.splice(+b.dataset.evx,1);redraw();});};
    bindEv();
    $('#ev_add').onclick=()=>{sync();evs.push({id:'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),date:T,text:''});redraw();};
    $('#ie_ok').onclick=()=>{sync();const date=$('#ie_date').value;const dts=[1,2,3].map(k=>$('#ie_d'+k).value||'');
      if(!date)return $('#ie_err').textContent='受傷日を入れてください。';
      const all=[date,...dts];if(all.some((d,i)=>d&&all.slice(i+1).some(e=>e&&e<d)))return $('#ie_err').textContent='段階の日付が前後しています。';
      j.date=date;j.dates=dts;j.what=$('#ie_what').value.trim()||j.what;j.notes=[0,1,2,3].map(k=>$('#ie_n'+k).value.trim());j.events=evs.filter(e=>e.date&&e.text.trim());save();toast('予定を保存しました');back();};};
  return `<button class="back" data-back>‹ やめる</button><h2 style="margin-top:4px">${esc(p.name)}　復帰までの予定</h2>
<div class="card pad" style="display:flex;flex-direction:column;gap:12px">
<label style="font-size:13px;color:var(--sub)">内容（診断名や症状）<input class="in" id="ie_what" value="${esc(j.what)}" style="margin-top:4px"></label>
<label class="dl"><span>受傷日</span><input type="date" class="in" id="ie_date" value="${j.date}"></label></div>
${[0,1,2,3].map(k=>`<h2>${STG[k]}<small>${STGD[k]}</small></h2><div class="card pad" style="display:flex;flex-direction:column;gap:10px">${k>0?`<label class="dl"><span>開始の予定日</span><input type="date" class="in" id="ie_d${k}" value="${j.dates[k-1]||''}"></label>`:''}<label style="font-size:13px;color:var(--sub)">内容・メニュー<textarea class="in" id="ie_n${k}" style="margin-top:4px" placeholder="${['例：安静・アイシング','例：チューブで可動域と筋力、バイク20分','例：ジョグ→パス→対人なしのメニュー','例：フル参加。最初の1週間は練習試合30分まで'][k]}">${esc(j.notes[k]||'')}</textarea></label></div>`).join('')}
<h2>通院・再評価など</h2><div class="card pad"><div id="evs" style="display:flex;flex-direction:column;gap:8px">${evHtml()}</div><button class="btn ghost sm" id="ev_add" style="margin-top:10px">＋予定を追加</button></div>
<div class="submit"><p class="err" id="ie_err"></p><button class="btn block" id="ie_ok">保存する</button></div>`;}
CTX.onRemote(()=>{const top=stack[stack.length-1];if(top===formView||document.querySelector('.modal')||document.querySelector('#nj_ok,#rp_ok'))return;const y=window.scrollY;render();window.scrollTo(0,y);});
render();
});
